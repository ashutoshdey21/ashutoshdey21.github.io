headline: Backend engineer building systems that stay correct under concurrency, failure and access boundaries.
descriptor: Ashutosh Dey, backend engineer (Java, PostgreSQL, AWS/GCP), San Francisco / Redwood City, CA
throughline: >-
  I build Java and Micronaut backend services on PostgreSQL, running on GCP and AWS. Most of my work is
  authorization, event processing and platform reliability for multi-tenant products: keeping data correct
  when tasks run in parallel, when other services fail, and when access rules change.
