ai:
  heading: How I work with AI agents
  body: >-
    I use Claude Code daily to write and review backend code. On top of it I built a multi-agent workflow
    that takes a Jira ticket to a pull request through five sub-agents. The design choices were the
    interesting part: each agent only gets the tools it needs (the reviewer cannot run builds, the shipping
    agent cannot edit code), every phase waits for my approval, fix loops stop after three passes, and
    comments from real PR reviews are fed back into the agents' instructions.
  link: /projects/agent-dev-workflow/
looking_for: >-
  Senior and Software Engineer II/III backend roles in the Bay Area, including teams building AI products
  or developer tools.
